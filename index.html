<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Epam Registration Form</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Create Account</h1>
    <form id="registrationForm">
      <div class="form-group">
        <label for="name">Full Name <span class="required-star">*</span></label>
        <input type="text" id="name" placeholder="Epam employee name" required />
      </div>

      <div class="form-group">
        <label for="email">Email Address <span class="required-star">*</span></label>
        <input type="email" id="email" placeholder="john@epam.com" required />
      </div>

      <div class="form-group">
        <label for="password">Password <span class="required-star">*</span></label>
        <input type="password" id="password" placeholder="••••••••" required />
      </div>

      <button type="submit">Register</button>

    <button type="button" class="signin-btn">Sign In</button>

      
    </form>
  </div>

  

  <script src="script.js"></script>
</body>
</html>
